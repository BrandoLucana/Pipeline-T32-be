name: Docker Hub

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  dockerhub:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build Project
        run: mvn clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_JEMITH }}
          password: ${{ secrets.DOCKERHUB_TOKEN_JEMITH }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dockerfile-jemith/Dockerfile
          push: true
          tags: |
            jemith28/pipeline-t32-be:latest
            jemith28/pipeline-t32-be:${{ github.sha }}
